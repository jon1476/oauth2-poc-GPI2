name: CI/CD Pipeline + Calidad + Linting + SBOM

on:
  push:
    branches: ["develop"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ag-prueba-front/package-lock.json

      # --- COMPILAR BACKEND ---
      - name: Compilar servidores
        run: |
          chmod +x authorization-server/mvnw
          chmod +x resource-server/mvnw
          cd authorization-server && ./mvnw clean package -DskipTests -B
          cd ../resource-server && ./mvnw clean package -DskipTests -B

      # --- GENERACIÓN DE SBOM ---
      - name: Generar SBOM Auth Server
        uses: anchore/sbom-action@v0
        with:
          path: ./authorization-server
          format: spdx-json
          output-file: auth-server.spdx.json

      - name: Generar SBOM Resource Server
        uses: anchore/sbom-action@v0
        with:
          path: ./resource-server
          format: spdx-json
          output-file: resource-server.spdx.json

      - name: Generar SBOM Frontend
        uses: anchore/sbom-action@v0
        with:
          path: ./ag-prueba-front
          format: spdx-json
          output-file: frontend.spdx.json

      # Persistencia de los archivos SBOM como artefactos
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: project-sboms
          path: "*.spdx.json"
          retention-days: 7

      # --- TEST FRONTEND ---
      - name: Instalar dependencias del frontend
        run: cd ag-prueba-front && npm ci

      - name: Testear frontend con cobertura
        run: cd ag-prueba-front && npm run test -- --no-watch --browsers=ChromeHeadless --code-coverage 2>&1 || true

      # --- ANÁLISIS SONARCLOUD ---
      - name: Ejecutar análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd authorization-server
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=jon1476_oauth2-poc-GPI2 \
            -Dsonar.organization=jon1476 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java,../resource-server/src/main/java,../ag-prueba-front/src \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,../resource-server/target/site/jacoco/jacoco.xml \
            -Dsonar.typescript.lcov.reportPaths=../ag-prueba-front/coverage/ag-prueba-front/lcov.info \
            -B
