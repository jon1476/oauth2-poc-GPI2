name: CI/CD Pipeline + Calidad + Artifacts

on:
  push:
    branches: ["develop"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ag-prueba-front/package-lock.json

      # --- BACKEND AUTH ---
      - name: Compilar servidor de autorización
        run: |
          chmod +x authorization-server/mvnw
          cd authorization-server && ./mvnw clean package -DskipTests -B

      - name: Archive Auth Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-server-release-${{ github.sha }}
          path: authorization-server/target/*.jar
          retention-days: 30

      # --- BACKEND RESOURCE ---
      - name: Compilar servidor de recursos
        run: |
          chmod +x resource-server/mvnw
          cd resource-server && ./mvnw clean package -DskipTests -B

      - name: Archive Resource Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resource-server-release-${{ github.sha }}
          path: resource-server/target/*.jar
          retention-days: 30

      # --- FRONTEND ---
      - name: Instalar y Compilar Frontend
        run: |
          cd ag-prueba-front
          npm ci
          npm run build -- --configuration=production

      - name: Archive Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: ag-prueba-front/dist/
          retention-days: 30

      # --- ANÁLISIS SONARCLOUD ---
      - name: Ejecutar análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd authorization-server
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=jon1476_oauth2-poc-GPI2 \
            -Dsonar.organization=jon1476 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java,../resource-server/src/main/java,../ag-prueba-front/src \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,../resource-server/target/site/jacoco/jacoco.xml \
            -Dsonar.typescript.lcov.reportPaths=../ag-prueba-front/coverage/ag-prueba-front/lcov.info \
            -B
