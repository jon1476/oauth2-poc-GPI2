name: CI/CD Pipeline + Calidad + SBOM + Artifacts

on:
  push:
    branches: ["develop"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Escanea todo el historial, no solo el último commit

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

  dependency-review:
    name: Dependency Review (SBOM Control)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Compara con el destino
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ag-prueba-front/package-lock.json

      # --- BACKEND AUTH ---
      - name: Compilar Auth Server
        run: |
          chmod +x authorization-server/mvnw
          cd authorization-server && ./mvnw clean package -DskipTests -B

      - name: Generar SBOM Auth Server
        uses: anchore/sbom-action@v0
        with:
          path: ./authorization-server
          format: spdx-json
          output-file: auth-server.spdx.json

      - name: Archive Auth Artifacts (Jar + SBOM)
        uses: actions/upload-artifact@v4
        with:
          name: auth-server-release-${{ github.sha }}
          path: |
            authorization-server/target/*.jar
            auth-server.spdx.json
          retention-days: 30

      # --- BACKEND RESOURCE ---
      - name: Compilar Resource Server
        run: |
          chmod +x resource-server/mvnw
          cd resource-server && ./mvnw clean package -DskipTests -B

      - name: Generar SBOM Resource Server
        uses: anchore/sbom-action@v0
        with:
          path: ./resource-server
          format: spdx-json
          output-file: resource-server.spdx.json

      - name: Archive Resource Artifacts (Jar + SBOM)
        uses: actions/upload-artifact@v4
        with:
          name: resource-server-release-${{ github.sha }}
          path: |
            resource-server/target/*.jar
            resource-server.spdx.json
          retention-days: 30

      # --- FRONTEND ---
      - name: Instalar y Compilar Frontend
        run: |
          cd ag-prueba-front
          npm ci
          npm run build -- --configuration=production

      - name: Generar SBOM Frontend
        uses: anchore/sbom-action@v0
        with:
          path: ./ag-prueba-front
          format: spdx-json
          output-file: frontend.spdx.json

      - name: Archive Frontend Artifacts (Dist + SBOM)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-${{ github.sha }}
          path: |
            ag-prueba-front/dist/
            frontend.spdx.json
          retention-days: 30

      # --- CONTROL Y AVISO DE MODIFICACIONES EN SBOM ---
      - name: SBOM Change Notification
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          echo "### Aviso de Control de SBOM" >> $GITHUB_STEP_SUMMARY
          echo "Se ha generado un nuevo manifiesto de componentes para esta versión." >> $GITHUB_STEP_SUMMARY
          echo "Cualquier cambio en las dependencias ha sido registrado en los artefactos del sistema." >> $GITHUB_STEP_SUMMARY
          echo "Estado del escaneo: **Completado con éxito**" >> $GITHUB_STEP_SUMMARY

      # --- ANÁLISIS SONARCLOUD ---
      - name: Test Frontend & Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Ejecutamos tests de front para cobertura
          cd ag-prueba-front && npm run test -- --no-watch --browsers=ChromeHeadless --code-coverage 2>&1 || true

          # Lanzamos Sonar desde la raíz o carpeta principal
          cd ../authorization-server
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=jon1476_oauth2-poc-GPI2 \
            -Dsonar.organization=jon1476 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java,../resource-server/src/main/java,../ag-prueba-front/src \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,../resource-server/target/site/jacoco/jacoco.xml \
            -Dsonar.typescript.lcov.reportPaths=../ag-prueba-front/coverage/ag-prueba-front/lcov.info \
            -B
