name: CI/CD Pipeline - Final Production

on:
  push:
    branches: ["develop"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  # 1. SEGURIDAD INICIAL (CIA)
  security-gate:
    name: Secret Scan & Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  # 2. CONSTRUCCIÓN, SBOM Y CALIDAD
  build-and-quality:
    needs: security-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Stack (Java 17 & Node 18)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # --- BACKEND AUTH ---
      - name: Build Auth Server
        run: |
          chmod +x authorization-server/mvnw
          cd authorization-server && ./mvnw clean package -DskipTests -B

      - name: Archive Auth Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-server-bin-${{ github.sha }}
          path: authorization-server/target/*.jar

      # --- BACKEND RESOURCE ---
      - name: Build Resource Server
        run: |
          chmod +x resource-server/mvnw
          cd resource-server && ./mvnw clean package -DskipTests -B

      - name: Archive Resource Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resource-server-bin-${{ github.sha }}
          path: resource-server/target/*.jar

      # --- FRONTEND ---
      - name: Build Frontend
        run: |
          cd ag-prueba-front && npm ci && npm run build -- --configuration=production

      - name: Archive Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: ag-prueba-front/dist/

      # --- SBOM ÚNICO (OKR 4) ---
      - name: Generate Global SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: project-inventory.spdx.json
          artifact-name: "sbom-inventory"

      # --- ANÁLISIS SONARCLOUD ---
      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd authorization-server
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=jon1476_oauth2-poc-GPI2 \
            -Dsonar.organization=jon1476 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java,../resource-server/src/main/java,../ag-prueba-front/src \
            -B

  # 3. ESCANEO DINÁMICO (POST-DEPLOY)
  deploy-and-owaspZap:
    needs: build-and-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Run
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
          docker compose up -d --build
          sleep 60

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:4200"
          fail_action: false
          issue_title: "Security Scan Report (OKR 4)"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: ""

      - name: Cleanup
        if: always()
        run: docker compose down
