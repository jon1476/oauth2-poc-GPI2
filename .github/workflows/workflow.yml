name: CI/CD Pipeline + Análisis de Calidad

on:
  push:
    branches: ["develop"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  # JOB 1: BUILD + TEST + QUALITY ANALYSIS (todo junto)
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ag-prueba-front/package-lock.json

      # --- COMPILAR Y TESTEAR BACKEND ---
      - name: Compilar y testear servidor de autorización
        run: cd authorization-server && ./mvnw clean verify -B
        continue-on-error: true

      - name: Compilar y testear servidor de recursos
        run: cd resource-server && ./mvnw clean verify -B
        continue-on-error: true

      # --- COMPILAR Y TESTEAR FRONTEND ---
      - name: Instalar dependencias del frontend
        run: cd ag-prueba-front && npm ci

      - name: Testear frontend con cobertura
        run: cd ag-prueba-front && npm run test -- --no-watch --browsers=ChromeHeadless --code-coverage 2>&1 || true

      # --- ANÁLISIS SONARCLOUD ---
      - name: Ejecutar análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=jon1476_oauth2-poc-GPI2 \
            -Dsonar.organization=jon1476 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=authorization-server/src/main/java,resource-server/src/main/java,ag-prueba-front/src \
            -Dsonar.coverage.jacoco.xmlReportPaths=authorization-server/target/site/jacoco/jacoco.xml,resource-server/target/site/jacoco/jacoco.xml \
            -Dsonar.typescript.lcov.reportPaths=ag-prueba-front/coverage/ag-prueba-front/lcov.info
        continue-on-error: true

  # JOB 2: DESPLIEGUE (solo si develop y es push)
  deploy:
    needs: build-and-analyze
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: Production
    steps:
      - name: Desplegar versión ${{ github.sha }}
        run: echo "🚀 Desplegando versión ${{ github.sha }} en producción..."
