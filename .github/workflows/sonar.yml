name: Analisis SonarQube 
on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'ag-prueba-front/package-lock.json'

      # --- BACKEND ---
      - name: Build & Test Backend
        run: mvn -B clean verify

      # --- FRONTEND ---
      - name: Install & Test Frontend
        run: |
          cd ag-prueba-front
          npm install
          # Ejecutamos con ChromeHeadless para que funcione en el servidor de GitHub
          npx ng test --no-watch --no-progress --browsers=ChromeHeadless --code-coverage
        continue-on-error: true # Sigue aunque no haya tests o fallen

      #SONARQUBE 
        name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=jon1476_oauth2-poc-GPI2 \
            -Dsonar.organization=jon1476 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=authorization-server/src/main/java,resource-server/src/main/java,ag-prueba-front/src \
            -Dsonar.coverage.jacoco.xmlReportPaths=authorization-server/target/site/jacoco/jacoco.xml,resource-server/target/site/jacoco/jacoco.xml \
            -Dsonar.typescript.lcov.reportPaths=ag-prueba-front/coverage/ag-prueba-front/lcov.info
