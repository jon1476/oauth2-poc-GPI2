name: Pipeline de CD

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Iniciar temporizador
        run: echo "START=$(date +%s)" >> $GITHUB_ENV

      - name: Descargar repositorio
        uses: actions/checkout@v4

      # ============ SERVIDOR DE AUTORIZACIÓN ============
      - name: Iniciar sesión en el registro de contenedores
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir imagen del servidor de autorización
        uses: docker/build-push-action@v5
        with:
          context: ./authorization-server
          push: true
          tags: |
            ${{ env.REGISTRY }}/oauth2-authorization-server:${{ github.sha }}
            ${{ env.REGISTRY }}/oauth2-authorization-server:latest

      # ============ SERVIDOR DE RECURSOS ============
      - name: Subir imagen del servidor de recursos
        uses: docker/build-push-action@v5
        with:
          context: ./resource-server
          push: true
          tags: |
            ${{ env.REGISTRY }}/oauth2-resource-server:${{ github.sha }}
            ${{ env.REGISTRY }}/oauth2-resource-server:latest

      # ============ FRONTEND ============
      - name: Subir imagen del frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ag-prueba-front
          push: true
          tags: |
            ${{ env.REGISTRY }}/oauth2-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/oauth2-frontend:latest

      - name: Finalizar temporizador
        run: echo "END=$(date +%s)" >> $GITHUB_ENV

      - name: Calcular duración
        run: |
          SECONDS=$((END-START))
          echo "Duración del pipeline: ${SECONDS} segundos"
          echo "DEPLOY_DURATION=${SECONDS}" >> $GITHUB_ENV

      - name: Resumen del Pipeline
        run: |
          echo "### Pipeline de CD ✅" >> $GITHUB_STEP_SUMMARY
          echo "**Imágenes Docker generadas:**" >> $GITHUB_STEP_SUMMARY
          echo "- oauth2-authorization-server:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- oauth2-resource-server:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- oauth2-frontend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tiempo total:** ${DEPLOY_DURATION} segundos" >> $GITHUB_STEP_SUMMARY
