name: CI/CD Pipeline

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  # JOB 1: SERVIDOR DE AUTORIZACIÓN
  build-authorization-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
      - name: Otorgar permisos de ejecución a mvnw
        run: chmod +x authorization-server/mvnw
      - name: Compilar servidor de autorización
        run: cd authorization-server && ./mvnw clean package -DskipTests

  # JOB 2: SERVIDOR DE RECURSOS
  build-resource-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
      - name: Otorgar permisos de ejecución a mvnw
        run: chmod +x resource-server/mvnw
      - name: Compilar servidor de recursos
        run: cd resource-server && ./mvnw clean package -DskipTests

  # JOB 3: FRONTEND
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ag-prueba-front/package-lock.json
      - name: Instalar dependencias
        run: cd ag-prueba-front && npm ci
      - name: Compilar Angular
        run: cd ag-prueba-front && npm run build -- --configuration=production

  # JOB 4: DESPLIEGUE SIN MONTAR DOCKER
  deploy:
    needs: [build-authorization-server, build-resource-server, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: Production
    steps:
      - name: Simular despliegue
        run: echo " Desplegando versión ${{ github.sha }} en producción..."
