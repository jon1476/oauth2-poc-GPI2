name: Pipeline de CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  despliegue:
    runs-on: ubuntu-latest

    steps:
      - name: Iniciar temporizador
        run: echo "START=$(date +%s)" >> $GITHUB_ENV

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar servidor de autorización
        working-directory: authorization-server
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests package

      - name: Subir artefacto servidor de autorización
        uses: actions/upload-artifact@v4
        with:
          name: authorization-server
          path: authorization-server/target/*.jar

      - name: Compilar servidor de recursos
        working-directory: resource-server
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests package

      - name: Subir artefacto servidor de recursos
        uses: actions/upload-artifact@v4
        with:
          name: resource-server
          path: resource-server/target/*.jar

      - name: Configurar Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Instalar dependencias del frontend
        working-directory: ag-prueba-front
        run: npm ci

      - name: Compilar frontend Angular
        working-directory: ag-prueba-front
        run: npm run build

      - name: Subir artefacto del frontend
        uses: actions/upload-artifact@v4
        with:
          name: ag-prueba-front-dist
          path: ag-prueba-front/dist/

      - name: Finalizar temporizador
        run: echo "END=$(date +%s)" >> $GITHUB_ENV

      - name: Calcular duración
        run: |
          SECONDS=$((END-START))
          echo "Duración del despliegue: ${SECONDS} segundos"
          echo "DEPLOY_DURATION=${SECONDS}" >> $GITHUB_ENV

      - name: Añadir resumen
        run: |
          echo "### Pipeline de CD" >> $GITHUB_STEP_SUMMARY
          echo "Tiempo de despliegue: ${DEPLOY_DURATION} segundos" >> $GITHUB_STEP_SUMMARY
