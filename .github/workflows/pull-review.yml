              // h = 2 → avisar cuando diff ∈ [1, 2)
              if (diffHoras >= 1 && diffHoras < 2) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `⚠️ **Aviso automático:**  
