name: Aviso PR (Queda 1 hora)

on:
  schedule:
    - cron: "*/10 * * * *"   # Cada 10 minutos
  workflow_dispatch:

jobs:
  avisos:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener PR abiertas
        id: prs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            return prs;

      - name: Revisar tiempos y avisar
        uses: actions/github-script@v7
        with:
          script: |
            const prs = ${{ steps.prs.outputs.result }};
            const ahora = new Date();

            for (const pr of prs) {
