name: Control de Pull Reviews

on:
  schedule:
    - cron: '0 * * * *'  # Se ejecuta cada hora
  workflow_dispatch:

jobs:
  revisar-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Revisar PR abiertos
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const h = 2; // horas límite
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });

            const now = new Date();

            for (const pr of prs) {
              const created = new Date(pr.created_at);
              const diffHrs = (now - created) / 1000 / 3600;
              
              if (diffHrs >= h - 1 && diffHrs < h) { 
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `Este Pull Request lleva abierto **${diffHrs.toFixed(1)}h**.  
Se acerca al límite de **${h}h** para ser revisado.`
                });
              }
            }
